        paperCount: { type: integer }
        publishedPaperCount: { type: integer }
        inProgressAttemptCount: { type: integer }
        dueWrongQuestionCount: { type: integer }
        activeWrongQuestionCount: { type: integer }
        masteredWrongQuestionCount: { type: integer }
        recentAttempts:
          type: array
          items: { $ref: '#/components/schemas/AttemptSummary' }
        recentWrongQuestions:
