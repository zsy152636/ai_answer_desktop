# =====================================================================================
# AI 智能答题系统 · Java 业务服务 OpenAPI 契约（v1）
#
# ⚠️ 本文件由**真实实现反推生成**，不是设计稿的手工抄写。
#    权威来源（按优先级）：
#      1. services/java-api/src/main/java/com/aia/answer/web/*.java        （路径与操作）
#      2. services/java-api/src/main/java/com/aia/answer/domain/*.java    （DTO 与字段名）
#      3. services/java-api/src/main/java/com/aia/answer/common/{ApiResponse,ApiException,ErrorCode,PageResult,Ids}.java
#      4. docs/api/api-contract.md                                        （契约说明）
#      5. contracts/json-schema/llm-config.schema.json                    （LLM 配置 Schema）
#
# 改动顺序（不可颠倒）：
#      ① 先改契约文档 docs/api/api-contract.md ──② 再改实现 ──③ 最后同步本文件。
#    任何"只改本文件"或"只改实现"的改动都会让三者不一致，评审时按契约违规处理。
#
# 生成基线：Java 实现 commit 状态 = 端到端冒烟 78 项 + 单测 22 项全通过的版本。
# =====================================================================================
openapi: 3.1.0

info:
  title: AI 智能答题系统 Java API
  version: 1.0.0
  description: |
    本机业务服务（Spring Boot 3），只监听 `127.0.0.1`，端口由操作系统随机分配。

    - **鉴权**：除 `GET /health` 外，所有 `/api/**` 请求必须携带 `X-Session-Token`
      （Java 启动时随机生成、只在本进程生命周期内有效、退出即失效）。
      缺失或错误 → `401` + `UNAUTHORIZED`。
    - **Host/Origin 校验**：`Host` 必须是 `127.0.0.1` / `localhost` / `::1`；
      `Origin` 若存在必须是 `http://127.0.0.1*`、`http://localhost*`、`http://[::1]*`、
      `file://` 或 `app://`（`Origin: null` 视为可信的非浏览器调用）。否则 `403` + `ORIGIN_REJECTED`。
    - **统一包络**：除 `GET /health` 外，所有响应都是 `ApiResponse`
      （`success` / `data` / `error` / `requestId` / `timestamp`）。
      Java 的 Jackson 配置为 `default-property-inclusion: always`，因此 DTO 字段**不会被省略**，
      可空字段会显式返回 `null`。
    - **幂等**：任何 `POST`/`PUT`/`PATCH` 请求带 `Idempotency-Key`（1-128 字符）时启用；
      同键同载荷重放首次结果（响应头 `Idempotent-Replay: true`），同键不同载荷 → `409` + `IDEMPOTENCY_CONFLICT`。
    - **时间**：全部 UTC ISO-8601，形如 `2026-10-10T14:00:00Z`。
    - **标识**：`<prefix>_<26 位 Crockford Base32 ULID>`，如 `q_01HQ...`、`at_...`、`task_...`；
      `requestId` 形如 `req_` + 26 位小写 ULID（见 `Ids.requestId()`）。
    - **分页**：`page` 从 1 开始、`size` 默认 20、范围 1-100，越界 → `400` + `VALIDATION_ERROR`。

servers:
  - url: http://127.0.0.1:{port}
    description: 本机业务服务（端口由操作系统随机分配，实际值写入运行时端点文件）
    variables:
      port:
        default: '53123'
        description: '运行时随机分配的端口；从 `<data-dir>/runtime/java-endpoint.json` 读取'

security:
  - sessionToken: []

tags:
  - name: meta
    description: 健康与元信息（契约 §1）
  - name: questions
    description: 题库与题目版本（契约 §2）
  - name: papers
    description: 试卷与发布快照（契约 §3）
  - name: attempts
    description: 答题与判分（契约 §4）
  - name: wrong-questions
    description: 错题闭环（契约 §5）
  - name: llm-profiles
    description: LLM 配置与凭据（契约 §6）
  - name: ai
    description: AI 能力对外入口（契约 §7，内部转调 Python 服务）
  - name: system
    description: 系统设置与备份（契约 §8）
  - name: tasks
    description: 异步任务（契约 §9）
  - name: documents
    description: 资料库与本地检索（契约 §11，阶段 6）
  - name: search
    description: 本地全文检索与索引状态（契约 §11，阶段 6）

paths:

  # ==================================================================================
  # §1 健康与元信息
  # ==================================================================================
  /health:
    get:
      tags: [meta]
      operationId: health
      summary: 健康检查（不鉴权）
      description: |
        唯一不校验会话令牌且不返回包络的端点（返回裸对象）。字段来自
        `HealthController.health()` + `AppInfo`：`service` 固定 `java-api`，`version` 固定 `1.0.0`。
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                service: java-api
                version: 1.0.0
                schemaVersion: 3
                uptimeSeconds: 42

  /api/v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: 应用元信息
      description: |
        数据目录、数据库路径与大小、schema 版本、FTS5 能力、AI 服务状态。
        `fts5Available` 与 `contractVersion` **只在**本接口返回。
      responses:
        '200': { $ref: '#/components/responses/OkMetaView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/dashboard:
    get:
      tags: [meta]
      operationId: getDashboard
      summary: 首页仪表盘统计
      responses:
        '200': { $ref: '#/components/responses/OkDashboardView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ==================================================================================
  # §2 题库与题目版本
  # ==================================================================================
  /api/v1/questions:
    get:
      tags: [questions]
      operationId: listQuestions
      summary: 题目分页列表
      description: |
        过滤参数白名单：`page,size,q,questionType,status,tag,sort`。
        `sort` 允许值（`QuestionRepository.orderClause`）：`updatedAt`、`-updatedAt`、
        `createdAt`、`-createdAt`；缺省 `-updatedAt`。白名单以外的 `sort` → `400` + `VALIDATION_ERROR`。
        `q` 同时匹配标题与当前版本题干；`tag` 精确匹配知识点标签（JSON 数组包含）。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchQ'
        - name: questionType
          in: query
          schema: { $ref: '#/components/schemas/QuestionType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QuestionStatus' }
        - name: tag
          in: query
          description: 知识点标签（精确匹配）
          schema: { type: string, maxLength: 32 }
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/QuestionSort' }
      responses:
        '200':
          description: 分页题目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/QuestionSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [questions]
      operationId: createQuestion
      summary: 建题（同时创建 version 1）
      description: |
        成功返回 `201`。请求体字段级规则见 `QuestionDtos.SaveRequest` 与
        `GradingService.validateAnswer`（选择题 2-10 个选项且 key 唯一、`answer.value` 必须命中正确选项等）。
        支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionSaveRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedQuestionView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }

  /api/v1/questions/{id}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [questions]
      operationId: getQuestion
      summary: 题目详情（可读历史版本）
      parameters:
        - name: versionNo
          in: query
          description: 指定历史版本号；省略则返回当前版本
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/OkQuestionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [questions]
      operationId: updateQuestion
      summary: 修改题目（内容变化则新建版本）
      description: |
        题干/选项/答案/rubric/标签任一变化 → 创建新 `question_version` 并把 `current_version_id` 指向它；
        否则只更新 `title`/`difficulty`。并发用 `expectedVersionNo` 做乐观锁，
        不匹配 → `409` + `VERSION_CONFLICT`。题型不可更改（`400` + `VALIDATION_ERROR`）。
        支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuestionSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkQuestionView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '版本冲突（`VERSION_CONFLICT`）或幂等键冲突（`IDEMPOTENCY_CONFLICT`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    delete:
      tags: [questions]
      operationId: deleteQuestion
      summary: 删除草稿题目
      description: '仅允许删除从未被引用且从未发布的草稿，否则 `409` + `STATE_CONFLICT`。'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [deleted, id]
                        properties:
                          deleted: { type: boolean, const: true }
                          id: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/questions/{id}/publish:
    post:
      tags: [questions]
      operationId: publishQuestion
      summary: 发布题目（draft → published）
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200': { $ref: '#/components/responses/OkQuestionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 状态不允许发布（已发布 / 已归档）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/questions/{id}/archive:
    post:
      tags: [questions]
      operationId: archiveQuestion
      summary: 归档题目
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200': { $ref: '#/components/responses/OkQuestionView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/questions/{id}/versions:
    get:
      tags: [questions]
      operationId: listQuestionVersions
      summary: 题目版本列表（按版本号倒序）
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      responses:
        '200':
          description: 版本列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/VersionBrief' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================================================
  # §3 试卷与发布快照
  # ==================================================================================
  /api/v1/papers:
    get:
      tags: [papers]
      operationId: listPapers
      summary: 试卷分页列表
      description: '过滤参数白名单 `page,size,q,status`；固定按 `updated_at DESC` 排序（无 sort 参数）。'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchQ'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PaperStatus' }
      responses:
        '200':
          description: 分页试卷列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PaperSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [papers]
      operationId: createPaper
      summary: 创建试卷（草稿）
      description: '成功返回 `201`。`questions[].score` 省略时默认每题 5 分。支持 `Idempotency-Key`。'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaperSaveRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedPaperView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/papers/{id}:
    parameters:
      - $ref: '#/components/parameters/PaperId'
    get:
      tags: [papers]
      operationId: getPaper
      summary: 试卷详情（含题目组成）
      responses:
        '200': { $ref: '#/components/responses/OkPaperView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [papers]
      operationId: updatePaper
      summary: 修改试卷（仅 draft）
      description: '非 `draft` 状态 → `409` + `STATE_CONFLICT`。支持 `Idempotency-Key`。'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaperSaveRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkPaperView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/papers/{id}/publish:
    post:
      tags: [papers]
      operationId: publishPaper
      summary: 发布试卷并生成不可变快照
      description: |
        题数 ≥1、总分 >0、引用题目版本必须存在且未归档，否则 `409` + `STATE_CONFLICT`。
        返回 `PaperSnapshotView`；发布后旧快照与既有作答结果永不改变。
      parameters:
        - $ref: '#/components/parameters/PaperId'
      responses:
        '200': { $ref: '#/components/responses/OkPaperSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/papers/{id}/archive:
    post:
      tags: [papers]
      operationId: archivePaper
      summary: 归档试卷
      parameters:
        - $ref: '#/components/parameters/PaperId'
      responses:
        '200': { $ref: '#/components/responses/OkPaperView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/papers/{id}/snapshots:
    get:
      tags: [papers]
      operationId: listPaperSnapshots
      summary: 试卷快照列表（版本号倒序）
      parameters:
        - $ref: '#/components/parameters/PaperId'
      responses:
        '200':
          description: 快照列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PaperSnapshotView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/papers/{id}/snapshots/{snapshotId}:
    get:
      tags: [papers]
      operationId: getPaperSnapshot
      summary: 读取历史快照
      parameters:
        - $ref: '#/components/parameters/PaperId'
        - name: snapshotId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OkPaperSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================================================
  # §4 答题与判分
  # ==================================================================================
  /api/v1/attempts:
    get:
      tags: [attempts]
      operationId: listAttempts
      summary: 作答分页列表
      description: '过滤参数白名单 `page,size,status,paperId`；固定按 `updated_at DESC` 排序。'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AttemptStatus' }
        - name: paperId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: 分页作答列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AttemptSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [attempts]
      operationId: startAttempt
      summary: 开始作答（试卷 / 错题练习）
      description: |
        成功返回 `201`。`mode` ∈ `paper`（默认，必须提供已发布试卷的 `paperId`）或
        `wrong_practice`（可按 `wrongQuestionIds` 或 `limit` 取到期错题）。
        试卷未发布 → `409` + `STATE_CONFLICT`；错题本为空 → `409` + `STATE_CONFLICT`。
        请求体可省略（等价于 `{"mode":"paper"}`，此时因缺 `paperId` 返回 `400`）。
        支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttemptStartRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedAttemptSheet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/attempts/{id}:
    get:
      tags: [attempts]
      operationId: getAttemptSheet
      summary: 答题卡（未提交时不含答案与解析）
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200': { $ref: '#/components/responses/OkAttemptSheet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/attempts/{id}/answers/{snapshotQuestionId}:
    put:
      tags: [attempts]
      operationId: saveAttemptAnswer
      summary: 幂等保存单题作答
      description: |
        `attempt.status` 必须 `in_progress`，否则 `409` + `STATE_CONFLICT`；
        `snapshotQuestionId` 不属于本次作答 → `400` + `VALIDATION_ERROR`。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/SnapshotQuestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAnswerRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkAnswerView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/attempts/{id}/submit:
    post:
      tags: [attempts]
      operationId: submitAttempt
      summary: 提交并确定性判分
      description: |
        幂等提交：持久化全部作答 → 确定性判分 → 生成错题记录 → 主观题排队 AI 评分任务
        （排队失败不影响已保存的作答）。返回 `AttemptResult`。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OkAttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/attempts/{id}/result:
    get:
      tags: [attempts]
      operationId: getAttemptResult
      summary: 作答结果（含逐题判分明细）
      description: '未提交时 → `409` + `STATE_CONFLICT`（"本次作答尚未提交，暂不能查看结果"）。'
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200': { $ref: '#/components/responses/OkAttemptResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/attempts/{id}/abandon:
    post:
      tags: [attempts]
      operationId: abandonAttempt
      summary: 放弃作答（in_progress → abandoned）
      parameters:
        - $ref: '#/components/parameters/AttemptId'
      responses:
        '200': { $ref: '#/components/responses/OkAttemptSheet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/attempts/{id}/ai-grade:
    post:
      tags: [attempts]
      operationId: requestAiGrading
      summary: 为待复核主观题排队 AI 评分任务
      description: |
        为本次作答所有 `pending_review` 主观题入队 `ai_grade` 任务（幂等键 `ai_grade:{answerId}`）。
        未提交 → `409`；没有待复核主观题 → `409`。任务完成后建议分写入
        `gradingDetail.suggestedScore`，但 `gradingStatus` **仍是** `pending_review`，
        必须经人工评分端点才生效。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已排队的任务 id 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiGradeResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/attempts/{id}/answers/{snapshotQuestionId}/grade:
    post:
      tags: [attempts]
      operationId: gradeSubjectiveManually
      summary: 人工评分（确认或覆盖 AI 建议分）
      description: |
        `score` 必须在 `[0, maxScore]`，否则 `400` + `VALIDATION_ERROR`；
        未提交 → `409` + `STATE_CONFLICT`。返回重算总分后的 `AttemptResult`
        （该题 `gradingMethod=manual`、`gradingStatus=graded`）。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/SnapshotQuestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualGradeRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkAttemptResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  # ==================================================================================
  # §5 错题闭环
  # ==================================================================================
  /api/v1/wrong-questions:
    get:
      tags: [wrong-questions]
      operationId: listWrongQuestions
      summary: 错题分页列表
      description: |
        过滤参数白名单 `page,size,status,dueOnly,tag,questionType,sort`。
        `sort` 允许值（`WrongQuestionRepository.orderClause`）：`-updatedAt`、`updatedAt`、
        `nextReviewAt`、`lastWrongAt`、`wrongCount`；缺省 `-updatedAt`。
        `dueOnly=true` 时只返回 `next_review_at <= now` 且状态为 `active`/`reviewing` 的错题。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/WrongStatus' }
        - name: dueOnly
          in: query
          schema: { type: boolean, default: false }
        - name: tag
          in: query
          schema: { type: string, maxLength: 32 }
        - name: questionType
          in: query
          schema: { $ref: '#/components/schemas/QuestionType' }
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/WrongQuestionSort' }
      responses:
        '200':
          description: 分页错题列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WrongQuestionPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/wrong-questions/practice:
    post:
      tags: [wrong-questions]
      operationId: practiceWrongQuestions
      summary: 创建错题练习作答
      description: |
        请求体可省略；缺省取全部到期错题。错题本为空 → `409` + `STATE_CONFLICT`。
        返回 `AttemptSheet`（`mode=wrong_practice`）。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkAttemptSheet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/wrong-questions/{id}:
    parameters:
      - $ref: '#/components/parameters/WrongQuestionId'
    get:
      tags: [wrong-questions]
      operationId: getWrongQuestion
      summary: 错题详情 + 最近 20 条复习记录
      responses:
        '200': { $ref: '#/components/responses/OkWrongQuestionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [wrong-questions]
      operationId: patchWrongQuestionStatus
      summary: 手动干预错题状态
      description: |
        `status` ∈ `active`/`reviewing`/`mastered`/`archived`。置为 `mastered`/`archived` 会清空
        `nextReviewAt`；置为 `active` 且 `nextReviewAt` 为空时按当前 `wrongCount` 重新排期。
        支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WrongStatusRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkWrongQuestionDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/wrong-questions/{id}/review:
    post:
      tags: [wrong-questions]
      operationId: reviewWrongQuestion
      summary: 记录一次复习并更新调度
      description: |
        `result` ∈ `correct`/`wrong`。答错：`wrongCount+1`、`correctStreak=0`、状态 `active`、
        `nextReviewAt=now+interval(wrongCount)`；复习正确：`correctStreak+1`，
        达到 2 次 → `mastered` 且 `nextReviewAt=null`，否则 `reviewing` 并按 `interval(wrongCount)` 排期。
        `interval(n)`：1→1 天、2→3 天、3→7 天、n≥4→15 天。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/WrongQuestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WrongReviewRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkWrongQuestionDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================================================
  # §6 LLM 配置与凭据
  # ==================================================================================
  /api/v1/settings/llm-profiles:
    get:
      tags: [llm-profiles]
      operationId: listLlmProfiles
      summary: 档案列表（不含明文密钥）
      responses:
        '200': { $ref: '#/components/responses/OkProfileList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [llm-profiles]
      operationId: createLlmProfile
      summary: 新建档案
      description: '成功返回 `201`。档案 id 已存在 → `409` + `STATE_CONFLICT`。支持 `Idempotency-Key`。'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpsertRequest' }
      responses:
        '201': { $ref: '#/components/responses/CreatedProfileView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/settings/llm-profiles/validate:
    post:
      tags: [llm-profiles]
      operationId: validateLlmConfig
      summary: 纯校验 LLM 配置（不写库、不发网络请求）
      description: |
        `config` 为 `llm-config.json` 内容（见 `contracts/json-schema/llm-config.schema.json`）。
        JSON 语法错误 → `400` + `CONFIG_JSON_INVALID`；版本不支持 → `400` + `CONFIG_SCHEMA_UNSUPPORTED`；
        结构/跨字段规则不满足则在 `data.errors` 中逐条返回（此时 `valid=false`，HTTP 仍为 `200`）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ValidationResponse' }
        '400':
          description: 'JSON 语法错误（`CONFIG_JSON_INVALID`）或版本不支持（`CONFIG_SCHEMA_UNSUPPORTED`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/settings/llm-profiles/test-connection:
    post:
      tags: [llm-profiles]
      operationId: testLlmConnection
      summary: 模型连接测试（短超时、最小请求）
      description: |
        `profile` 与 `profileId` 至少提供其一（都缺 → `400` + `VALIDATION_ERROR`）。
        Java 转发给 Python 服务并统一错误分类，**不返回请求头与密钥**。
        Java 侧把 provider 故障映射为 `category`：`LLM_AUTH_FAILED→auth`、
        `LLM_CONNECT_TIMEOUT→timeout`、`BASE_URL_BLOCKED→blocked`、
        `LLM_UNAVAILABLE→unavailable`、其它→`protocol`。
        即便 provider 失败，本接口仍返回 HTTP `200` + `ok=false`（属于结果而非请求错误）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestConnectionRequest' }
      responses:
        '200':
          description: 连接测试结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TestConnectionResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/settings/llm-profiles/import/preview:
    post:
      tags: [llm-profiles]
      operationId: previewLlmConfigImport
      summary: 导入预览（不修改当前配置）
      description: |
        `config` 不能为空，否则 `400` + `VALIDATION_ERROR`。`previewId` 有效期 10 分钟。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportPreviewRequest' }
      responses:
        '200':
          description: 预览结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ImportPreviewResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/settings/llm-profiles/import/confirm:
    post:
      tags: [llm-profiles]
      operationId: confirmLlmConfigImport
      summary: 应用导入预览
      description: |
        `previewId` 不存在/已过期/已应用 → `409` + `STATE_CONFLICT`；
        预览中存在校验错误 → `400` + `VALIDATION_ERROR`。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportConfirmRequest' }
      responses:
        '200':
          description: 应用结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ImportConfirmResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/settings/llm-profiles/export:
    post:
      tags: [llm-profiles]
      operationId: exportLlmConfig
      summary: 脱敏导出 LLM 配置
      description: |
        返回 `llm-config.json` 结构（`schemaVersion`/`defaultProfileId`/`profiles`）。
        `apiKeyRef` 保留，绝不含明文密钥与内部令牌。
      responses:
        '200':
          description: 导出内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExportResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/settings/llm-profiles/default:
    put:
      tags: [llm-profiles]
      operationId: setDefaultLlmProfile
      summary: 切换默认档案
      description: |
        `profileId` 为 `null` 时必须显式传 `disableAi: true`，否则 `400` + `VALIDATION_ERROR`。
        返回更新后的档案列表。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefaultProfileRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkProfileList' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/settings/llm-profiles/{id}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    put:
      tags: [llm-profiles]
      operationId: updateLlmProfile
      summary: 保存档案（configRevision+1）
      description: '失败保留上一有效配置。支持 `Idempotency-Key`。'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpsertRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkProfileView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [llm-profiles]
      operationId: deleteLlmProfile
      summary: 删除档案（同时清理凭据绑定）
      description: '正在使用的默认档案 → `409` + `STATE_CONFLICT`。返回更新后的档案列表。'
      responses:
        '200': { $ref: '#/components/responses/OkProfileList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/settings/llm-profiles/{id}/credential:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    post:
      tags: [llm-profiles]
      operationId: setLlmProfileCredential
      summary: 绑定密钥（写 OS 凭据存储）
      description: '只接受写入，不回读密钥；响应不回显 `apiKey`，只把 `credentialConfigured` 置为 `true`。'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkProfileView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [llm-profiles]
      operationId: deleteLlmProfileCredential
      summary: 解绑密钥
      responses:
        '200': { $ref: '#/components/responses/OkProfileView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================================================================================
  # §7 AI 能力对外入口
  # ==================================================================================
  /api/v1/ai/questions/{id}/explain:
    post:
      tags: [ai]
      operationId: explainQuestion
      summary: 题目讲解（转调 Python AI 服务）
      description: |
        Java 侧组装题干/选项/答案/解析与默认档案凭据后转发给 Python 服务的
        `POST /api/v1/ai/explain`，并把返回的 `data` 原样透出。
        题目无当前版本 → `404`；AI 服务不可用 → `503` + `LLM_UNAVAILABLE`；
        超时 → `504` + `LLM_CONNECT_TIMEOUT`。
      parameters:
        - $ref: '#/components/parameters/QuestionId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExplainRequest' }
      responses:
        '200':
          description: '讲解结果（Python 服务 `data` 内容）'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExplainData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/LlmUnavailable' }
        '504': { $ref: '#/components/responses/LlmTimeout' }


  # ==================================================================================
  # §8 系统设置与备份
  # ==================================================================================
  /api/v1/system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: 系统信息（数据目录、日志目录、备份列表、凭据后端、AI 状态）
      responses:
        '200': { $ref: '#/components/responses/OkSystemInfoView' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/system/backups:
    get:
      tags: [system]
      operationId: listBackups
      summary: 备份列表
      responses:
        '200':
          description: 备份列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/BackupView' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/system/backup:
    post:
      tags: [system]
      operationId: createBackup
      summary: 立即备份
      description: |
        用 `VACUUM INTO` 生成一致性快照到 `<data-dir>/backups/`。备份未通过完整性校验时
        立即删除并返回 `500` + `INTERNAL_ERROR`，不留可疑文件。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OkBackupView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/system/backups/verify:
    post:
      tags: [system]
      operationId: verifyBackup
      summary: 只读校验指定备份（恢复前二次确认）
      parameters:
        - name: fileName
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IntegrityView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/system/restore:
    post:
      tags: [system]
      operationId: restoreBackup
      summary: 请求从备份恢复（下次启动执行）
      description: |
        校验备份（`integrity_check` + `foreign_key_check` + `schema_version` 存在）后写
        `restore-request.json`；真正的替换在下次启动、打开连接池之前执行，替换前自动备份当前库。
        缺 `confirm=true` → `400` + `VALIDATION_ERROR`。支持 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RestoreRequest' }
      responses:
        '200':
          description: 已登记恢复请求
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RestoreResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/system/integrity-check:
    post:
      tags: [system]
      operationId: runIntegrityCheck
      summary: 立即执行完整性检查
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/IntegrityView' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/system/seed-demo:
    post:
      tags: [system]
      operationId: seedDemoData
      summary: 幂等写入演示题库
      description: '6 题覆盖 6 种题型 + 1 张已发布试卷；已存在则跳过。支持 `Idempotency-Key`。'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 写入结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SeedDemoResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/system/logs:
    get:
      tags: [system]
      operationId: listLogFiles
      summary: 日志文件列表（按修改时间倒序）
      responses:
        '200':
          description: 日志文件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LogFileView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/system/logs/tail:
    get:
      tags: [system]
      operationId: tailLogFile
      summary: 读取日志尾部（默认 500 行，已脱敏）
      description: |
        `file` 必须是日志目录内的普通文件，且路径规范化后仍位于日志目录内，
        否则 `404` + `RESOURCE_NOT_FOUND`（防目录穿越）。返回行经过 `LogRedactor` 脱敏。
      parameters:
        - name: file
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 日志尾部内容
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LogTailView' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/system/files:
    get:
      tags: [system]
      operationId: getFileConsistencyReport
      summary: 资料文件一致性报告
      description: |
        只读巡检（契约 §11.5）：`orphanFiles` 为磁盘上有文件但 `imported_file` 无记录、
        且已超过保留窗口（`retentionHours`，24 小时）的条目（按 `relativePath` 升序）；
        `missingFiles` 为数据库有记录但磁盘文件缺失的资料；`tempFiles` 为 temp 目录下的文件数。
        路径一律是相对数据目录的相对路径（正斜杠），不含用户目录绝对路径。
      responses:
        '200': { $ref: '#/components/responses/OkFileConsistencyReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/system/files/cleanup:
    post:
      tags: [system]
      operationId: cleanupFiles
      summary: 资料文件一致性补偿（默认 dry-run）
      description: |
        请求体可整体省略，也可为 `{ "dryRun": boolean }`；`dryRun` 缺省 **true**（只报告不修改）。
        仅显式传 `false` 才执行破坏性动作：删除超过保留窗口的孤儿文件与临时文件，并把
        「有记录但文件缺失」的资料标记为 `failed`（`errorCode=DOCUMENT_PARSE_FAILED`、
        消息含相对路径，保留记录、不自动发布部分结果）。
        `markedFailed` 在 dry-run 下也统计**将被**标记的资料数（实现里该计数不受 dryRun 影响）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FileCleanupRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkFileCleanupResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==================================================================================
  # §9 异步任务
  # ==================================================================================
  /api/v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 任务分页列表
      description: '过滤参数白名单 `page,size,status,taskType`。'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: taskType
          in: query
          description: 'v1 只实现 `ai_grade`'
          schema: { type: string }
      responses:
        '200':
          description: 分页任务列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TaskViewPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: 任务详情
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { $ref: '#/components/responses/OkTaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/tasks/{id}/retry:
    post:
      tags: [tasks]
      operationId: retryTask
      summary: 重试任务（failed/cancelled → queued）
      description: '重置 `attemptCount=0`、`nextRunAt=now`。其它状态 → `409` + `STATE_CONFLICT`。'
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { $ref: '#/components/responses/OkTaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  /api/v1/tasks/{id}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: 取消任务（queued/running/retry_wait → cancelled）
      description: '已结束（`succeeded`/`failed`）→ `409` + `STATE_CONFLICT`。'
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200': { $ref: '#/components/responses/OkTaskView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/StateConflict' }

  # ==================================================================================
  # §11 资料库与本地检索（阶段 6）
  # ==================================================================================
  /api/v1/documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: 资料分页列表
      description: |
        过滤参数 `page,size,q,status,sha256`（`DocumentController.list` 全部可选）。
        `page` 缺省 1、`size` 缺省 20 且必须落在 1-100（否则 `400` + `VALIDATION_ERROR`）。
        `q` 匹配标题（模糊）；`status` 白名单 `imported`/`indexed`/`failed`（其它值 → `400`）；
        `sha256` 按文件哈希精确过滤，用于重复导入后取回已存在资料供用户选择「复用 / 新建」。
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/SearchQ'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DocumentStatus' }
        - name: sha256
          in: query
          description: '文件 SHA-256（64 位小写十六进制），按内容过滤'
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OkDocumentSummaryPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/documents/import:
    post:
      tags: [documents]
      operationId: importDocument
      summary: 导入文本资料
      description: |
        请求体 `{ "sourcePath", "sha256", "title"?, "onDuplicate"? }`（`DocumentDtos.ImportRequest`）。
        落盘顺序固定（契约 §11.5）：先写临时文件 → **服务端重算 SHA-256** 与入参比对（防 TOCTOU，
        不一致 → `400` + `VALIDATION_ERROR`）→ 校验后缀白名单与体积 → 原子移动到正式目录 →
        短事务登记 → 分块 → 建索引。返回值与 `GET /api/v1/documents/{id}` 同形。

        - `sha256` 可选；省略则不比对，由服务端计算结果作为事实。
        - 后缀不在白名单（仅 `.txt`/`.md`/`.markdown`）→ `400` + `DOCUMENT_FORMAT_UNSUPPORTED`；
          超过 8 MiB → `400` + `DOCUMENT_TOO_LARGE`；文件为空或解码/解析失败 → `400` + `DOCUMENT_PARSE_FAILED`。
        - `onDuplicate` ∈ `reject`（缺省）| `reuse` | `new`（其它值 → `400`）。同 `sha256` 已有资料时：
          `reject` → `409` + `STATE_CONFLICT`（`error.details` 为 `[{field:"sourcePath", message}]`）；
          `reuse` → 直接返回已有资料；`new` → 复用同一份磁盘文件、只新增一条资料记录。
        - 落盘登记成功、但**解析**阶段解码失败（既非 UTF-8 也非 GB18030）或解析不出文本时**不抛错**：
          落一条 `status=failed` 的资料记录，`errorCode` 为 `DOCUMENT_PARSE_FAILED`，原文文件保留
          （开发文档 §505）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentImportRequest' }
      responses:
        '200': { $ref: '#/components/responses/OkDocumentSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: '同 `sha256` 已导入且 `onDuplicate=reject`（`STATE_CONFLICT`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/documents/reindex:
    post:
      tags: [documents]
      operationId: rebuildDocumentIndex
      summary: 重建索引（版本化）
      description: |
        建立新 `indexVersion` → 全量分块重建 → 完整性自检 → 切换 `activeVersion`；
        任一步失败即丢弃新版本分块与索引行、保留旧版本继续对外服务，并返回
        `500` + `DOCUMENT_INDEX_FAILED`（契约 §11.4 第 4 条）。失败明细在 `error.message` 里，
        成功时 `failures` 为**恒为空数组**（实现只在失败分支里累积明细并抛错）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { $ref: '#/components/responses/OkIndexRebuildResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500':
          description: '索引重建失败，旧索引版本保留（`DOCUMENT_INDEX_FAILED`，`retryable=true`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }

  /api/v1/documents/{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      operationId: getDocument
      summary: 资料详情
      description: '不存在 → `404` + `RESOURCE_NOT_FOUND`。'
      responses:
        '200': { $ref: '#/components/responses/OkDocumentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: 删除资料及其分块与索引行
      description: |
        先删 FTS 行（依赖分块 id）再删 `document`（分块靠外键级联）；
        仅当同一 `sha256` 已无其它资料引用时才删除磁盘文件并清理 `imported_file` 记录，
        因此 `fileRemoved=false` 表示文件仍被其它资料复用。不存在 → `404` + `RESOURCE_NOT_FOUND`。
      responses:
        '200': { $ref: '#/components/responses/OkDocumentDeleteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/documents/{id}/chunks:
    get:
      tags: [documents]
      operationId: listDocumentChunks
      summary: 分块预览（供校对与引用核对）
      description: |
        只读取该资料 `indexVersion` 对应的分块；资料无 `indexVersion` 时用当前 `activeVersion`。
        分页参数与列表一致（`page` 缺省 1、`size` 缺省 20、1-100）。不存在 → `404` + `RESOURCE_NOT_FOUND`。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { $ref: '#/components/responses/OkChunkViewPage' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/search:
    get:
      tags: [search]
      operationId: searchDocuments
      summary: 本地检索（FTS5，不可用时降级关键词）
      description: |
        `q` 必填，去空白后不能为空、最多 200 个码点（否则 `400` + `VALIDATION_ERROR`）。
        `limit` 缺省 10、范围 1-50，越界 → `400` + `VALIDATION_ERROR`。
        `documentId` 可选，用于把检索限制在单份资料内。

        响应 `mode` 如实反映**本次实际生效**的实现（`fts5` | `keyword`，契约 §11.4）：
        FTS5 可用且查询每个词都不短于 3 字符（trigram 下限）时走 FTS5，命中为空、
        查询过短或 FTS5 表缺失/语句异常时降级为 `LIKE` 关键词检索并返回 `keyword`，
        降级不会把 500 抛给用户。
      parameters:
        - name: q
          in: query
          required: true
          description: '检索关键词（1-200 字符）；去空白后为空或超长 → `400` + `VALIDATION_ERROR`'
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          description: '返回条数上限，缺省 10'
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: documentId
          in: query
          description: '限定单份资料（`doc_` 前缀），省略则检索全部资料'
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OkSearchResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/search/index:
    get:
      tags: [search]
      operationId: getSearchIndexState
      summary: 索引状态（当前活跃版本与分块统计）
      description: |
        `updatedAt` 在 `index_state` 行缺失时用当前时间；`fts5Available` 为 FTS5 + trigram 能力探测结果；
        `documentCount`/`chunkCount` 是全体资料数与 `activeVersion` 的分块数。
      responses:
        '200': { $ref: '#/components/responses/OkIndexState' }
        '401': { $ref: '#/components/responses/Unauthorized' }

# ======================================================================================
# components
# ======================================================================================
components:

  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: X-Session-Token
      description: |
        Java 服务启动时随机生成的 256bit hex 会话令牌（不落库、退出即失效），
        从 `<data-dir>/runtime/java-endpoint.json` 的 `sessionToken` 字段读取。
        除 `GET /health` 外所有 `/api/**` 请求都必须携带。

  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, minimum: 1, default: 1 }
    Size:
      name: size
      in: query
      description: 每页条数
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SearchQ:
      name: q
      in: query
      description: 关键词（题目匹配标题与题干；试卷匹配标题与说明）
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        幂等键（1-128 字符）。同键同载荷重放首次结果（响应头 `Idempotent-Replay: true`），
        同键不同载荷 → `409` + `IDEMPOTENCY_CONFLICT`。
      schema: { type: string, minLength: 1, maxLength: 128 }
    QuestionId:
      name: id
      in: path
      required: true
      description: '题目 id（`q_` 前缀）'
      schema: { type: string, pattern: '^q_[0-9A-Z]{26}$' }
    PaperId:
      name: id
      in: path
      required: true
      description: '试卷 id（`p_` 前缀）'
      schema: { type: string, pattern: '^p_[0-9A-Z]{26}$' }
    AttemptId:
      name: id
      in: path
      required: true
      description: '作答 id（`at_` 前缀）'
      schema: { type: string, pattern: '^at_[0-9A-Z]{26}$' }
    SnapshotQuestionId:
      name: snapshotQuestionId
      in: path
      required: true
      description: '快照题目 id（`sq_` 前缀）'
      schema: { type: string, pattern: '^sq_[0-9A-Z]{26}$' }
    WrongQuestionId:
      name: id
      in: path
      required: true
      description: '错题 id（`wq_` 前缀）'
      schema: { type: string, pattern: '^wq_[0-9A-Z]{26}$' }
    ProfileId:
      name: id
      in: path
      required: true
      description: LLM 档案 id
      schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
    TaskId:
      name: id
      in: path
      required: true
      description: '异步任务 id（`task_` 前缀）'
      schema: { type: string, pattern: '^task_[0-9A-Z]{26}$' }
    DocumentId:
      name: id
      in: path
      required: true
      description: '资料 id（`doc_` 前缀，见 `common/Ids`）'
      schema: { type: string, pattern: '^doc_[0-9A-Z]{26}$' }

  responses:
    Unauthorized:
      description: '会话令牌缺失或失效（`UNAUTHORIZED`）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
          example:
            success: false
            data: null
            error:
              code: UNAUTHORIZED
              message: 会话令牌缺失或已失效，请重启桌面应用
              details: []
              retryable: false
            requestId: req_01hq8z9k3m4n5p6q7r8s9t0uvw
            timestamp: '2026-10-10T14:00:00Z'
    ValidationError:
      description: '字段校验失败（`VALIDATION_ERROR`，`details` 给出字段级明细）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    NotFound:
      description: '资源不存在（`RESOURCE_NOT_FOUND`）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    StateConflict:
      description: '状态不允许当前操作（`STATE_CONFLICT`）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    IdempotencyConflict:
      description: '同一幂等键不同载荷（`IDEMPOTENCY_CONFLICT`）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    LlmUnavailable:
      description: 'AI 服务或模型不可用（`LLM_UNAVAILABLE`，重试可恢复）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    LlmTimeout:
      description: '连接模型服务超时（`LLM_CONNECT_TIMEOUT`）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    InternalError:
      description: '未预期错误（`INTERNAL_ERROR`，响应只带 requestId 便于诊断）'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }

    OkMetaView:
      description: 元信息
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/MetaView' }
    OkDashboardView:
      description: 仪表盘
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/DashboardView' }
    OkQuestionView:
      description: 题目详情
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/QuestionView' }
    CreatedQuestionView:
      description: '已创建题目（`201`）'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/QuestionView' }
    OkPaperView:
      description: 试卷详情
      content:
        application/json:
