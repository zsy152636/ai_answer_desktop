      description: 文件一致性补偿结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/FileCleanupResponse' }

  schemas:

    # ---------------------------------------------------------------- 通用包络与错误
    ApiResponse:
      type: object
      description: |
        统一响应包络（`common/ApiResponse.java`）。成功时 `error` 为 `null`，失败时 `data` 为 `null`。
        Java 侧 `default-property-inclusion: always`，所有字段都会出现。
      required: [success, data, error, requestId, timestamp]
      properties:
        success: { type: boolean }
        data:
          description: '成功时的业务数据；失败时为 `null`'
        error:
          oneOf:
            - $ref: '#/components/schemas/ApiError'
            - type: 'null'
        requestId:
          type: string
          description: '请求编号，形如 `req_` + 26 位小写 Crockford Base32 ULID'
          examples: [req_01hq8z9k3m4n5p6q7r8s9t0uvw]
        timestamp:
          type: string
          description: UTC ISO-8601（秒精度）
          examples: ['2026-10-10T14:00:00Z']

    ApiError:
      type: object
      description: '失败详情（`ApiResponse.ApiError`）。`message` 面向用户，不含密钥与供应商原始错误全文。'
      required: [code, message, details, retryable]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        details:
          type: array
          items: { $ref: '#/components/schemas/FieldViolation' }
        retryable:
          type: boolean
          description: '与 `ErrorCode` 的 retryable 属性一致'

    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: '字段路径，如 `stem`、`answer.value`、`questions.score`'
        message: { type: string }

    ErrorCode:
      type: string
      description: '冻结错误码（`common/ErrorCode.java`）。新增码必须先改契约文档。'
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - ORIGIN_REJECTED
        - RESOURCE_NOT_FOUND
        - STATE_CONFLICT
        - VERSION_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - DB_BUSY
        - DB_MIGRATION_FAILED
        - CONFIG_JSON_INVALID
        - CONFIG_SCHEMA_UNSUPPORTED
        - BASE_URL_BLOCKED
        - CREDENTIAL_MISSING
        - LLM_AUTH_FAILED
        - LLM_CONNECT_TIMEOUT
        - LLM_UNAVAILABLE
        - TASK_RETRY_EXHAUSTED
        - DOCUMENT_FORMAT_UNSUPPORTED
        - DOCUMENT_TOO_LARGE
        - DOCUMENT_PARSE_FAILED
        - DOCUMENT_INDEX_FAILED
        - INTERNAL_ERROR

    HealthResponse:
      type: object
      description: '`GET /health` 的裸对象（不走包络），由 `HealthController` 组装。'
      required: [status, service, version, schemaVersion, uptimeSeconds]
      properties:
        status: { type: string, const: UP }
        service: { type: string, const: java-api }
        version: { type: string, const: 1.0.0 }
        schemaVersion: { type: integer, description: 数据库 schema 版本 }
        uptimeSeconds: { type: integer, description: JVM 运行时长（秒） }

    PageResult:
      type: object
      description: '分页结果（`common/PageResult.java`）。'
      required: [items, page, size, total, totalPages]
      properties:
        items: { type: array, items: {} }
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    # ---------------------------------------------------------------- 枚举
    QuestionType:
      type: string
      enum: [single_choice, multiple_choice, true_false, fill_blank, short_answer, essay]
    QuestionStatus:
      type: string
      enum: [draft, published, archived]
    PaperStatus:
      type: string
      enum: [draft, published, archived]
    AttemptMode:
      type: string
      enum: [paper, wrong_practice]
    AttemptStatus:
      type: string
      enum: [in_progress, submitted, graded, abandoned]
    GradingMethod:
      type: string
      enum: [exact, normalized, partial_credit, ai_rubric, manual, ungraded]
    GradingStatus:
      type: string
      enum: [graded, pending_review, failed]
    WrongStatus:
      type: string
      enum: [active, reviewing, mastered, archived]
    TaskStatus:
      type: string
      enum: [queued, running, succeeded, retry_wait, failed, cancelled]
    LlmProvider:
      type: string
      description: 'v1 实现 `openai-compatible` 与 `ollama`；其余为预留（数据库 CHECK 允许存储）'
      enum: [openai-compatible, ollama, anthropic, azure-openai]
    QuestionSort:
      type: string
      description: '缺省 `-updatedAt`'
      enum: [updatedAt, '-updatedAt', createdAt, '-createdAt']
    WrongQuestionSort:
      type: string
      description: '缺省 `-updatedAt`'
      enum: ['-updatedAt', updatedAt, nextReviewAt, lastWrongAt, wrongCount]
    TestConnectionCategory:
      type: string
      enum: [ok, dns, tls, auth, model_not_found, quota, timeout, protocol, blocked, unavailable]

    # ---------------------------------------------------------------- 题库
    OptionView:
      type: object
      required: [key, content, correct]
      properties:
        key: { type: string, maxLength: 8 }
        content: { type: string }
        correct: { type: boolean }

    VersionBrief:
      type: object
      required: [id, versionNo, createdAt, changeNote]
      properties:
        id: { type: string }
        versionNo: { type: integer, minimum: 1 }
        createdAt: { type: string }
        changeNote: { type: [string, 'null'] }

    QuestionSummary:
      type: object
      required: [id, title, questionType, status, difficulty, currentVersionNo, knowledgeTags, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        currentVersionNo: { type: integer, minimum: 1 }
        knowledgeTags:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 32 }
        updatedAt: { type: string }

    QuestionVersionView:
      type: object
      description: '题目版本内容。`answer`/`rubric` 是自由 JSON（按题型不同形状，见契约 §2.1）。'
      required: [id, versionNo, stem, options, answer, explanation, rubric, knowledgeTags, changeNote, createdAt]
      properties:
        id: { type: string }
        versionNo: { type: integer, minimum: 1 }
        stem: { type: string, maxLength: 5000 }
        options:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/OptionView' }
        answer:
          description: '标准答案 JSON（`Answer` 结构，按题型不同）'
        explanation: { type: [string, 'null'], maxLength: 5000 }
        rubric:
          description: '评分细则 JSON（`{ criteria: [{ id, desc, weight }], maxScore }`）；无则 `null`'
        knowledgeTags:
          type: array
          items: { type: string }
        changeNote: { type: [string, 'null'], maxLength: 500 }
        createdAt: { type: string }

    QuestionView:
      type: object
      required: [id, title, questionType, status, difficulty, currentVersion, versions, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        currentVersion:
          oneOf:
            - $ref: '#/components/schemas/QuestionVersionView'
            - type: 'null'
        versions:
          type: array
          items: { $ref: '#/components/schemas/VersionBrief' }
        createdAt: { type: string }
        updatedAt: { type: string }

    QuestionSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/QuestionSummary' }

    QuestionSaveRequest:
      type: object
      description: '建题/改题请求（`QuestionDtos.SaveRequest`）。'
      required: [title, questionType, stem, answer]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { type: integer, minimum: 1, maximum: 5, description: 缺省 2 }
        stem: { type: string, minLength: 1, maxLength: 5000 }
        options:
          type: [array, 'null']
          description: '选择题必须 2-10 个且 `key` 唯一；`true_false` 不传；选项内容同样作为不可信文本处理'
          items: { $ref: '#/components/schemas/OptionView' }
        answer:
          description: |
            标准答案 JSON。按题型：
            `single_choice` → `{type, value:"C"}`；
            `multiple_choice` → `{type, value:["A","C"], partialCredit?}`；
            `true_false` → `{type, value:true}`；
            `fill_blank` → `{type, blanks:[{index, accepted:[...], normalize:{...}}]}`；
            `short_answer`/`essay` → `{type, referenceAnswer, rubric?}`
        explanation: { type: [string, 'null'], maxLength: 5000 }
        rubric:
          description: '评分细则 JSON；与 `answer.rubric` 二选一，简答/论述题必须提供其一'
        knowledgeTags:
          type: [array, 'null']
          maxItems: 20
          items: { type: string, maxLength: 32 }
        changeNote: { type: [string, 'null'], maxLength: 500 }
        expectedVersionNo:
          type: [integer, 'null']
          description: '乐观锁期望版本号；不匹配 → `VERSION_CONFLICT`'

    # ---------------------------------------------------------------- 试卷
    PaperSummary:
      type: object
      required: [id, title, status, questionCount, totalScore, publishedAt, createdAt, updatedAt, latestSnapshotId]
      properties:
        id: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/PaperStatus' }
        questionCount: { type: integer }
        totalScore: { type: number, format: double }
        publishedAt: { type: [string, 'null'] }
        createdAt: { type: string }
        updatedAt: { type: string }
        latestSnapshotId: { type: [string, 'null'] }

    PaperQuestionView:
      type: object
      required: [id, questionId, questionVersionId, orderNo, score, title, questionType, versionNo]
      properties:
        id: { type: string }
        questionId: { type: string }
        questionVersionId: { type: string }
        orderNo: { type: integer, minimum: 1 }
        score: { type: number, format: double }
        title: { type: string }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        versionNo: { type: integer }

    PaperView:
      type: object
      required: [id, title, description, status, questionCount, totalScore, publishedAt, createdAt, updatedAt, latestSnapshotId, questions]
      properties:
        id: { type: string }
        title: { type: string }
        description: '{ type: [string, ''null''] }'
        status: { $ref: '#/components/schemas/PaperStatus' }
        questionCount: { type: integer }
        totalScore: { type: number, format: double }
        publishedAt: { type: [string, 'null'] }
        createdAt: { type: string }
        updatedAt: { type: string }
        latestSnapshotId: { type: [string, 'null'] }
        questions:
          type: array
          items: { $ref: '#/components/schemas/PaperQuestionView' }

    PaperSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PaperSummary' }

    QuestionRef:
      type: object
      required: [questionId]
      properties:
        questionId: { type: string, description: 题目 id }
        questionVersionId: { type: [string, 'null'], description: 省略则取该题当前版本 }
        score:
          type: [number, 'null']
          format: double
          description: '省略默认 5 分；范围 (0, 100]'

    PaperSaveRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: '{ type: [string, ''null''], maxLength: 1000 }'
        questions:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/QuestionRef' }

    SnapshotQuestionView:
      type: object
      required: [id, orderNo, score, questionId, questionVersionId, questionType, stem, options, answer, explanation, rubric, knowledgeTags]
      properties:
        id: { type: string }
        orderNo: { type: integer, minimum: 1 }
        score: { type: number, format: double }
        questionId: { type: string }
        questionVersionId: { type: string }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string }
        options:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/OptionView' }
        answer: { description: 快照里的标准答案 JSON }
        explanation: { type: [string, 'null'] }
        rubric: { description: 评分细则 JSON }
        knowledgeTags:
          type: array
          items: { type: string }

    PaperSnapshotView:
      type: object
      description: '不可变发布快照（`PaperDtos.PaperSnapshotView`）。'
      required: [id, paperId, versionNo, title, description, questionCount, totalScore, publishedAt, questions]
      properties:
        id: { type: string }
        paperId:
          type: [string, 'null']
          description: '错题练习快照的 `paperId` 为 `null`'
        versionNo: { type: integer, minimum: 1 }
        title: { type: string }
        description: '{ type: [string, ''null''] }'
        questionCount: { type: integer, minimum: 1 }
        totalScore: { type: number, format: double }
        publishedAt: { type: string }
        questions:
          type: array
          items: { $ref: '#/components/schemas/SnapshotQuestionView' }

    # ---------------------------------------------------------------- 作答与判分
    AttemptStartRequest:
      type: object
      description: '开始作答请求（`AttemptDtos.StartRequest`）。整体可省略。'
      properties:
        paperId:
          type: [string, 'null']
          description: '`mode=paper` 时必填（已发布试卷）'
        mode:
          oneOf: '[{ $ref: '#/components/schemas/AttemptMode' }, { type: 'null' }]'
          description: '缺省 `paper`'
        wrongQuestionIds:
          type: [array, 'null']
          items: { type: string }
        limit:
          type: [integer, 'null']
          description: '`wrong_practice` 时取到期错题条数上限'

    AttemptSummary:
      type: object
      required: [id, paperId, paperSnapshotId, paperTitle, mode, status, totalScore, maxScore, questionCount, startedAt, submittedAt, gradedAt]
      properties:
        id: { type: string }
        paperId: { type: [string, 'null'] }
        paperSnapshotId: { type: [string, 'null'] }
        paperTitle: { type: string }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        totalScore: { type: [number, 'null'], format: double }
        maxScore: { type: [number, 'null'], format: double }
        questionCount: { type: integer }
        startedAt: { type: string }
        submittedAt: { type: [string, 'null'] }
        gradedAt: { type: [string, 'null'] }

    AttemptSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AttemptSummary' }

    SheetQuestion:
      type: object
      description: '答题卡题目。未提交（`in_progress`）时 `answer`/`explanation` 为 `null`。'
      required: [snapshotQuestionId, orderNo, score, questionType, stem, options, knowledgeTags, answer, explanation]
      properties:
        snapshotQuestionId: { type: string }
        orderNo: { type: integer, minimum: 1 }
        score: { type: number, format: double, description: 本题满分 }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string }
        options:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/OptionView' }
        knowledgeTags:
          type: array
          items: { type: string }
        answer:
          description: '标准答案；未提交时为 `null`'
        explanation:
          type: [string, 'null']
          description: '解析；未提交时为 `null`'

    AnswerView:
      type: object
      description: '单题作答（`AttemptDtos.AnswerView`）。'
      required: [snapshotQuestionId, questionId, questionVersionId, answer, score, maxScore, gradingMethod, gradingStatus, gradingDetail, savedAt]
      properties:
        snapshotQuestionId: { type: string }
        questionId: { type: string }
        questionVersionId: { type: string }
        answer: { description: 用户作答 JSON }
        score:
          type: [number, 'null']
          format: double
          description: '主观题待复核时为 `null`'
        maxScore: { type: number, format: double }
        gradingMethod: { $ref: '#/components/schemas/GradingMethod' }
        gradingStatus: { $ref: '#/components/schemas/GradingStatus' }
        gradingDetail:
          description: |
            判分明细 JSON。确定性判分含 `ruleVersion`（v1 = `"1.0"`）；
            AI 建议分写入 `suggestedScore` + `criteria` + `needsReview: true`；
            人工评分含 `manualScore`、`note`、`gradedBy`。
        savedAt: { type: string }

    AttemptSheet:
      type: object
      required: [id, paperId, paperSnapshotId, paperTitle, mode, status, totalScore, maxScore, startedAt, submittedAt, gradedAt, questions, answers]
      properties:
        id: { type: string }
        paperId: { type: [string, 'null'] }
        paperSnapshotId: { type: [string, 'null'] }
        paperTitle: { type: string }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        status: { $ref: '#/components/schemas/AttemptStatus' }
        totalScore: { type: [number, 'null'], format: double }
        maxScore: { type: [number, 'null'], format: double }
        startedAt: { type: string }
        submittedAt: { type: [string, 'null'] }
        gradedAt: { type: [string, 'null'] }
        questions:
          type: array
          items: { $ref: '#/components/schemas/SheetQuestion' }
        answers:
          type: array
          items: { $ref: '#/components/schemas/AnswerView' }

    ResultItem:
      type: object
      required: [snapshotQuestionId, orderNo, questionType, stem, options, userAnswer, correctAnswer, explanation, score, maxScore, correct, gradingMethod, gradingStatus, gradingDetail, knowledgeTags]
      properties:
        snapshotQuestionId: { type: string }
        orderNo: { type: integer, minimum: 1 }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        stem: { type: string }
        options:
          type: [array, 'null']
          items: { $ref: '#/components/schemas/OptionView' }
        userAnswer:
          description: '用户作答 JSON；未作答为 `null`'
        correctAnswer: { description: 标准答案 JSON }
        explanation: { type: [string, 'null'] }
        score: { type: [number, 'null'], format: double }
        maxScore: { type: number, format: double }
        correct: { type: boolean }
        gradingMethod: { $ref: '#/components/schemas/GradingMethod' }
        gradingStatus: { $ref: '#/components/schemas/GradingStatus' }
        gradingDetail: { description: 判分明细 JSON }
        knowledgeTags:
          type: array
          items: { type: string }

    AttemptResult:
      type: object
      required: [attempt, items, correctCount, wrongCount, unansweredCount, pendingReviewCount]
      properties:
        attempt: { $ref: '#/components/schemas/AttemptSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/ResultItem' }
        correctCount: { type: integer }
        wrongCount: { type: integer }
        unansweredCount: { type: integer }
        pendingReviewCount: { type: integer, description: 待人工复核的主观题数量 }

    SaveAnswerRequest:
      type: object
      required: [answer]
      properties:
        answer:
          description: '作答 JSON（按题型不同形状，与题目 `answer` 同构）'

    ManualGradeRequest:
      type: object
      required: [score]
      properties:
        score:
          type: number
          format: double
          description: '必须在 `[0, maxScore]`'
        note: { type: [string, 'null'], description: 复核备注 }

    AiGradeResponse:
      type: object
      required: [taskIds, pendingCount]
      properties:
        taskIds:
          type: array
          items: { type: string }
        pendingCount: { type: integer, description: 排队的主观题数量 }

    # ---------------------------------------------------------------- 错题
    WrongQuestionView:
      type: object
      description: '错题视图（`WrongDtos.WrongQuestionView`）。`currentVersionNo != wrongVersionNo` 时 UI 必须提示题目已改义。'
      required: [id, questionId, questionVersionId, questionType, title, stem, status, wrongCount, correctStreak, lastWrongAt, nextReviewAt, lastScore, maxScore, knowledgeTags, currentVersionNo, wrongVersionNo, createdAt, updatedAt]
      properties:
        id: { type: string }
        questionId: { type: string }
        questionVersionId: { type: string }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        title: { type: string }
        stem: { type: string }
        status: { $ref: '#/components/schemas/WrongStatus' }
        wrongCount: { type: integer, minimum: 1 }
        correctStreak: { type: integer, minimum: 0 }
        lastWrongAt: { type: string }
        nextReviewAt: { type: [string, 'null'] }
        lastScore: { type: [number, 'null'], format: double }
        maxScore: { type: [number, 'null'], format: double }
        knowledgeTags:
          type: array
          items: { type: string }
        currentVersionNo: { type: integer }
        wrongVersionNo: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    WrongQuestionPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WrongQuestionView' }

    ReviewRecord:
      type: object
      required: [id, result, note, intervalDaysBefore, intervalDaysAfter, nextReviewAt, durationSeconds, reviewedAt]
      properties:
        id: { type: string }
        result: { type: string, enum: [correct, wrong] }
        note: { type: [string, 'null'] }
        intervalDaysBefore: { type: [integer, 'null'] }
        intervalDaysAfter: { type: [integer, 'null'] }
        nextReviewAt: { type: [string, 'null'] }
        durationSeconds: { type: [integer, 'null'] }
        reviewedAt: { type: string }

    WrongQuestionDetail:
      type: object
      required: [question, reviews]
      properties:
        question: { $ref: '#/components/schemas/WrongQuestionView' }
        reviews:
          type: array
          description: 最近 20 条复习记录，按时间倒序
          items: { $ref: '#/components/schemas/ReviewRecord' }

    WrongReviewRequest:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [correct, wrong] }
        note: { type: [string, 'null'] }
        durationSeconds: { type: [integer, 'null'] }
        attemptAnswerId:
          type: [string, 'null']
          description: '关联的作答记录 id（`aa_` 前缀）'

    PracticeRequest:
      type: object
      properties:
        wrongQuestionIds:
          type: [array, 'null']
          items: { type: string }
        limit: { type: [integer, 'null'], description: 缺省取全部到期错题 }

    WrongStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, reviewing, mastered, archived] }

    # ---------------------------------------------------------------- LLM 配置与凭据
    ProfileView:
      type: object
      description: '档案视图（`LlmDtos.ProfileView`）。**绝不含明文密钥**。'
      required: [id, name, provider, baseUrl, model, apiKeyRef, timeoutSeconds, connectTimeoutSeconds, allowLocalNetwork, parameters, credentialConfigured, isDefault, updatedAt]
      properties:
        id: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 64 }
        provider: { $ref: '#/components/schemas/LlmProvider' }
        baseUrl: { type: string, maxLength: 512, description: 无尾部斜杠 }
        model: { type: string, maxLength: 128 }
        apiKeyRef:
          type: [string, 'null']
          description: '形如 `credential://llm/<profileId>`；永不是明文密钥'
        timeoutSeconds: { type: integer, minimum: 1, maximum: 900, default: 60 }
        connectTimeoutSeconds: { type: integer, minimum: 1, maximum: 120, default: 5 }
        allowLocalNetwork: { type: boolean, default: false }
        parameters: { type: object, additionalProperties: true }
        credentialConfigured: { type: boolean }
        isDefault:
          type: boolean
          description: 'Java 记录组件名为 `isDefault`，JSON 字段同为 `isDefault`'
        updatedAt: { type: string }

    ProfileListResponse:
      type: object
      required: [profiles, defaultProfileId, configRevision, credentialBackend]
      properties:
        profiles:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ProfileView' }
        defaultProfileId: { type: [string, 'null'] }
        configRevision: { type: integer }
        credentialBackend:
          type: string
          description: '如 `windows-credential-manager`、`file`'

    ProfileUpsertRequest:
      type: object
      required: [name, provider, baseUrl, model]
      properties:
        id:
          type: [string, 'null']
          maxLength: 64
          pattern: '^$|^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
          description: '新建时可选（省略则生成）；已存在 → `409` + `STATE_CONFLICT`'
        name: { type: string, minLength: 1, maxLength: 64 }
        provider: { $ref: '#/components/schemas/LlmProvider' }
        baseUrl:
          type: string
          minLength: 1
          maxLength: 512
          description: '必须以 `http://` 或 `https://` 开头'
        model: { type: string, minLength: 1, maxLength: 128 }
        timeoutSeconds: { type: [integer, 'null'], minimum: 1, maximum: 900, description: 缺省 60 }
        connectTimeoutSeconds: { type: [integer, 'null'], minimum: 1, maximum: 120, description: 缺省 5 }
        allowLocalNetwork: { type: [boolean, 'null'], default: false }
        parameters: { type: [object, 'null'], additionalProperties: true, description: 见 llm-config.schema.json 的 parameters }

    CredentialRequest:
      type: object
      required: [apiKey]
      properties:
        apiKey: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: 只写不回读，响应不含该字段 }

    ValidateRequest:
      type: object
      required: [config]
      properties:
        config:
          description: '`llm-config.json` 内容（`{ schemaVersion, defaultProfileId?, profiles[] }`）'

    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
          description: '如 `profiles[0].baseUrl`'
        message: { type: string }

    ValidationSummary:
      type: object
      required: [profileCount, providers]
      properties:
        profileCount: { type: integer }
        providers:
          type: array
          items: { type: string }

    ValidationResponse:
      type: object
      required: [valid, errors, summary]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        summary: { $ref: '#/components/schemas/ValidationSummary' }

    TestConnectionRequest:
      type: object
      description: |
        `profile`（内联 profile 对象，可带一次性 `apiKey`）与 `profileId` 至少一个。
        `useStoredCredential=true` 时使用 OS 凭据存储中的密钥。
      properties:
        profile: { type: [object, 'null'], additionalProperties: true, description: 内联 profile（形状同 ProfileView + 可选 apiKey） }
        profileId: { type: [string, 'null'] }
        useStoredCredential: { type: [boolean, 'null'] }

    TestConnectionResponse:
      type: object
      required: [ok, category, latencyMs, httpStatus, modelEcho, message, suggestion]
      properties:
        ok: { type: boolean }
        category: { $ref: '#/components/schemas/TestConnectionCategory' }
        latencyMs: { type: integer }
        httpStatus:
          type: [integer, 'null']
          description: '供应商返回的 HTTP 状态码；无响应时为 `null`'
        modelEcho: { type: [string, 'null'] }
        message: { type: string }
        suggestion: { type: string }

    ChangeItem:
      type: object
      required: [action, profileId, name, fields]
      properties:
        action: { type: string, enum: [create, update, unchanged, conflict] }
        profileId: { type: string }
        name: { type: string }
        fields:
          type: array
          items: { type: string }

    ImportPreviewRequest:
      type: object
      required: [config]
      properties:
        config:
          description: '`llm-config.json` 内容'

    ImportPreviewResponse:
      type: object
      required: [previewId, summary, changes, errors, expiresAt]
      properties:
        previewId:
          type: string
          description: '`prev_` 前缀；有效期 10 分钟'
        summary: { $ref: '#/components/schemas/ValidationSummary' }
        changes:
          type: array
          items: { $ref: '#/components/schemas/ChangeItem' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/ValidationIssue' }
        expiresAt: { type: string }

    ImportConfirmRequest:
      type: object
      required: [previewId]
      properties:
        previewId: { type: string, minLength: 1 }

    ImportConfirmResponse:
      type: object
      required: [created, updated, unchanged, configRevision]
      properties:
        created: { type: integer }
        updated: { type: integer }
        unchanged: { type: integer }
        configRevision: { type: integer }

    ExportResponse:
      type: object
      description: '脱敏导出的 `llm-config.json`。含 `schemaVersion`/`defaultProfileId`/`profiles`，绝不含明文密钥。'
      additionalProperties: true

    DefaultProfileRequest:
      type: object
      properties:
        profileId:
          type: [string, 'null']
          description: '为 `null` 时必须同时传 `disableAi: true`'
        disableAi: { type: [boolean, 'null'] }

    # ---------------------------------------------------------------- 系统与任务
    AiServiceStatus:
      type: object
      description: 'Python AI 服务状态（`/meta`、`/dashboard`、`/system/info` 三处形状一致）。'
      required: [available, baseUrl, latencyMs, message]
      properties:
        available: { type: boolean }
        baseUrl:
          type: [string, 'null']
          description: '`available=false` 时可能为 `null`'
        latencyMs: { type: [integer, 'null'] }
        message: { type: [string, 'null'], description: 可读原因，如"AI 服务未启动" }

    MetaView:
      type: object
      required: [appVersion, contractVersion, schemaVersion, dataDir, databasePath, databaseSizeBytes, fts5Available, aiService, startedAt]
      properties:
        appVersion: { type: string }
        contractVersion: { type: string, const: '1.0' }
        schemaVersion: { type: integer }
        dataDir: { type: string }
        databasePath: { type: string }
        databaseSizeBytes: { type: integer }
        fts5Available: { type: boolean }
        aiService: { $ref: '#/components/schemas/AiServiceStatus' }
        startedAt: { type: string }

    DashboardView:
      type: object
      required: [questionCount, publishedQuestionCount, paperCount, publishedPaperCount, inProgressAttemptCount, dueWrongQuestionCount, activeWrongQuestionCount, masteredWrongQuestionCount, recentAttempts, recentWrongQuestions, aiService]
      properties:
        questionCount: { type: integer }
