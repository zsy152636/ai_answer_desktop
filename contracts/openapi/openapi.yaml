          items: { $ref: '#/components/schemas/WrongQuestionView' }
        aiService: { $ref: '#/components/schemas/AiServiceStatus' }

    BackupView:
      type: object
      required: [fileName, sizeBytes, checksum, createdAt, schemaVersion, appVersion, integrityOk, kind]
      properties:
        fileName: { type: string }
        sizeBytes: { type: integer }
        checksum: { type: string }
        createdAt: { type: string }
        schemaVersion: { type: integer }
        appVersion: { type: string }
        integrityOk: { type: boolean }
        kind: { type: string, enum: [manual, auto, pre-migration] }

    SystemInfoView:
      type: object
      required: [appVersion, schemaVersion, dataDir, logDir, databasePath, databaseSizeBytes, backupCount, backups, uptimeSeconds, credentialBackend, aiService]
      properties:
        appVersion: { type: string }
        schemaVersion: { type: integer }
        dataDir: { type: string }
        logDir: { type: string }
        databasePath: { type: string }
        databaseSizeBytes: { type: integer }
        backupCount: { type: integer }
        backups:
          type: array
          items: { $ref: '#/components/schemas/BackupView' }
        uptimeSeconds: { type: integer }
        credentialBackend: { type: string }
        aiService: { $ref: '#/components/schemas/AiServiceStatus' }

    RestoreRequest:
      type: object
      required: [fileName]
      properties:
        fileName: { type: string, minLength: 1 }
        confirm:
          type: [boolean, 'null']
          description: '必须为 `true`，否则 `400` + `VALIDATION_ERROR`'

    RestoreResponse:
      type: object
      required: [pendingRestore, requiresRestart, backup]
      properties:
        pendingRestore: { type: boolean }
        requiresRestart: { type: boolean }
        backup:
          oneOf:
            - $ref: '#/components/schemas/BackupView'
            - type: 'null'

    IntegrityView:
      type: object
      required: [ok, integrityCheck, foreignKeyCheck, schemaVersion, databaseSizeBytes]
      properties:
        ok: { type: boolean }
        integrityCheck:
          type: string
          description: '`PRAGMA integrity_check` 结果，正常为 `ok`'
        foreignKeyCheck:
          type: string
          description: '`PRAGMA foreign_key_check` 结果，正常为 `ok`'
        schemaVersion: { type: integer }
        databaseSizeBytes: { type: integer }

    SeedDemoResponse:
      type: object
      required: [questionsCreated, papersCreated, skipped]
      properties:
        questionsCreated: { type: integer }
        papersCreated: { type: integer }
        skipped: { type: boolean }

    LogFileView:
      type: object
      required: [fileName, sizeBytes, modifiedAt]
      properties:
        fileName: { type: string }
        sizeBytes: { type: integer }
        modifiedAt: { type: string }

    LogTailView:
      type: object
      required: [fileName, lines]
      properties:
        fileName: { type: string }
        lines:
          type: array
          description: 尾部 N 行（默认 500），已脱敏
          items: { type: string }

    TaskView:
      type: object
      description: '异步任务（`SystemDtos.TaskView`）。'
      required: [id, taskType, status, payload, result, attemptCount, maxAttempts, leaseOwner, leaseUntil, heartbeatAt, nextRunAt, lastErrorCode, lastErrorMessage, createdAt, updatedAt]
      properties:
        id: { type: string }
        taskType:
          type: string
          description: 'v1 已实现 `ai_grade`'
        status: { $ref: '#/components/schemas/TaskStatus' }
        payload: { description: 任务载荷 JSON }
        result: { description: 任务结果 JSON }
        attemptCount: { type: integer }
        maxAttempts: { type: integer, default: 5 }
        leaseOwner: { type: [string, 'null'] }
        leaseUntil: { type: [string, 'null'] }
        heartbeatAt: { type: [string, 'null'] }
        nextRunAt: { type: [string, 'null'] }
        lastErrorCode: { type: [string, 'null'] }
        lastErrorMessage: { type: [string, 'null'] }
        createdAt: { type: string }
        updatedAt: { type: string }

    TaskViewPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/TaskView' }

    # ---------------------------------------------------------------- AI 能力
    ExplainRequest:
      type: object
      description: |
        讲解请求（`AiController.explain`）。三个字段组全部可选：`userAnswer`/`profileId` 为阶段 5 既有字段；
        `useKnowledgeBase`/`knowledgeLimit`/`query` 为阶段 6 的检索增强开关（契约 §11.3）。
        `useKnowledgeBase` 缺省 `false`（不注入 `references`，行为与阶段 5 完全一致）。
        `knowledgeLimit` 实现里会被钳制到 1-10（非数字或缺省 → 5）；`query` 去空白后为空时，
        由 Java 用「题干 + 选项」拼出检索查询（最多 200 字符）。
      properties:
        userAnswer: { description: 用户作答 JSON；省略则不分析错因 }
        profileId: { type: [string, 'null'], description: 省略则使用默认档案 }
        useKnowledgeBase:
          type: [boolean, 'null']
          default: false
          description: '为 `true` 时先做本地检索，把前 N 条分块作为 `references` 交给 Python（不可信输入）'
        knowledgeLimit:
          type: [integer, 'null']
          minimum: 1
          maximum: 10
          default: 5
          description: '检索依据条数；实现按 `max(1, min(10, value))` 钳制'
        query:
          type: [string, 'null']
          maxLength: 200
          description: '自定义检索查询；省略或空白则用题干 + 选项拼接'

    ExplainData:
      type: object
      additionalProperties: true
      description: |
        Python AI 服务 `POST /api/v1/ai/explain` 返回的 `data`，Java 原样透出。
        字段清单与 `services/python-ai/app/schemas.py::ExplainResponse` 对齐。
        Java 侧只对 `citations` 做一次**引用回映射**（模型给的 `citations: [{refId, used}]`
        会被替换为带来源坐标的列表，只保留本次实际提供过的 `refId`，`used` 字段被丢弃），
        `injectionSuspected` 等其余字段原样透出；因此这里标注 `additionalProperties: true`
        （实现返回的是 `JsonNode` 自由对象，契约之外的字段不会被拦截）。
      required: [explanation, tips, model, usage, latencyMs]
      properties:
        explanation: { type: string, description: 中文讲解：为什么成立、错在哪、怎么记 }
        tips:
          type: array
          items: { type: string }
        model: { type: string }
        usage: { type: object, additionalProperties: true, description: 供应商返回的 token 统计 }
        latencyMs: { type: integer }
        credentialRef:
          type: [string, 'null']
          description: '形如 `credential://llm/<profileId>`，永不是明文密钥'
        citations:
          type: array
          description: |
            讲解实际引用的资料分块（契约 §11.3）。未开启 `useKnowledgeBase`、检索无命中或
            模型未引用任何提供过的 `refId` 时为空数组；每个元素都能回到
            `GET /api/v1/documents/{id}/chunks` 逐字核对。
          items: { $ref: '#/components/schemas/Citation' }
        injectionSuspected:
          type: boolean
          description: |
            检索片段命中可疑指令模式的标记（仅标记与脱敏日志，不改变主流程，也不影响 `citations`）。
            由 Python 侧计算；未开启知识库检索时为 `false`。

    GradeSubjectiveResponse:
      type: object
      description: |
        Python 服务 `POST /api/v1/ai/grade-subjective` 的响应形状（`SystemDtos.GradeSubjectiveResponse`
        用于 `ai_grade` 任务的中间结果；Java 侧不直接对外暴露该端点，对外走
        `/api/v1/attempts/{id}/answers/{snapshotQuestionId}/grade`）。
      required: [snapshotQuestionId, suggestedScore, maxScore, gradingStatus, gradingDetail, message]
      properties:
        snapshotQuestionId: { type: string }
        suggestedScore: { type: [number, 'null'], format: double }
        maxScore: { type: number, format: double }
        gradingStatus: { $ref: '#/components/schemas/GradingStatus' }
        gradingDetail:
          description: '含 `suggestedScore`、`criteria`、`confidence`、`needsReview`'
        message: { type: string }

    # ---------------------------------------------------------------- 资料库与本地检索（§11）
    DocumentStatus:
      type: string
      description: '资料状态（`imported`/`indexed`/`failed`；`status` 查询参数只接受这三个值）'
      enum: [imported, indexed, failed]

    DocumentSummary:
      type: object
      description: |
        资料摘要（`DocumentDtos.DocumentSummary`，与 `DocumentRepository.toSummary` 一致）。
        `originalFileName`/`sha256` 在文件记录缺失时是**空字符串**而不是 `null`（实现里的兜底值）。
      required: [id, title, status, sourceKind, originalFileName, sizeBytes, sha256, chunkCount, charCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string, maxLength: 200 }
        status: { $ref: '#/components/schemas/DocumentStatus' }
        sourceKind:
          type: string
          enum: [text, markdown]
          description: '`text`（`.txt`）或 `markdown`（`.md`/`.markdown`）'
        originalFileName:
          type: string
          description: '原始文件名，只作显示元数据；文件记录缺失时为空字符串'
        sizeBytes: { type: integer, minimum: 0 }
        sha256:
          type: string
          description: '文件内容 SHA-256（64 位小写十六进制）；文件记录缺失时为空字符串'
        chunkCount: { type: integer, minimum: 0 }
        charCount: { type: integer, minimum: 0 }
        indexVersion: { type: [integer, 'null'], minimum: 1 }
        parserVersion:
          type: [string, 'null']
          description: '解析器版本，如 `text-v1+utf8`；未解析时为 `null`'
        errorCode:
          type: [string, 'null']
          description: '`status=failed` 时的错误码（如 `DOCUMENT_PARSE_FAILED`），其它状态为 `null`'
        errorMessage:
          type: [string, 'null']
          description: '`status=failed` 时的可读原因，已脱敏、不含文件绝对路径'
        createdAt: { type: string }
        updatedAt: { type: string }

    DocumentSummaryPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DocumentSummary' }

    ChunkView:
      type: object
      description: '资料分块（`DocumentDtos.ChunkView`）。`pageNo` 首期为 `null`（纯文本无页码）。'
      required: [id, documentId, chunkIndex, content, contentHash, parserVersion, indexVersion, createdAt]
      properties:
        id: { type: string, description: '分块 id（`chk_` 前缀）' }
        documentId: { type: string }
        chunkIndex: { type: integer, minimum: 0 }
        pageNo: { type: [integer, 'null'], minimum: 1 }
        content: { type: string }
        contentHash: { type: string, description: 分块内容 SHA-256 }
        parserVersion: { type: string }
        indexVersion: { type: integer, minimum: 1 }
        createdAt: { type: string }

    ChunkViewPage:
      allOf:
        - $ref: '#/components/schemas/PageResult'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ChunkView' }

    DocumentImportRequest:
      type: object
      description: |
        导入文本资料请求（`DocumentDtos.ImportRequest`）。`sourcePath` 必填（绝对路径），
        服务端会重新计算 SHA-256 与 `sha256` 比对（防 TOCTOU）；`onDuplicate` 缺省 `reject`。
      required: [sourcePath]
      properties:
        sourcePath:
          type: string
          minLength: 1
          description: '来源文件绝对路径；文件不存在/非普通文件/路径越界 → `400` + `VALIDATION_ERROR`'
        sha256:
          type: [string, 'null']
          description: '客户端预先算好的 SHA-256；与服务端重算结果不一致 → `400` + `VALIDATION_ERROR`'
        title:
          type: [string, 'null']
          maxLength: 200
          description: '显示标题；省略则用文件名（去扩展名），最长截断到 200 字符'
        onDuplicate:
          type: [string, 'null']
          default: reject
          description: |
            重复 `sha256` 的处理方式，取值 `reject` | `reuse` | `new`（其它值 → `400` + `VALIDATION_ERROR`）。
            实现先把缺省/空白归一化为 `reject`，因此文档里额外允许 `null`（等价于省略）。
          enum: [reject, reuse, new, 'null']

    DocumentDeleteResponse:
      type: object
      description: '删除结果（`DocumentDtos.DocumentDeleteResponse`）。'
      required: [deleted, fileRemoved]
      properties:
        deleted: { type: boolean }
        fileRemoved:
          type: boolean
          description: '仅当同一 `sha256` 已无其它资料引用、且磁盘文件确实被删除时为 `true`'

    IndexRebuildResponse:
      type: object
      description: |
        索引重建结果（`DocumentDtos.IndexRebuildResponse`）。成功时 `failures` 恒为空数组
        （实现只在失败分支累积明细并抛 `DOCUMENT_INDEX_FAILED`）。
      required: [indexState, chunks, failures]
      properties:
        indexState: { $ref: '#/components/schemas/IndexState' }
        chunks: { type: integer, minimum: 0, description: 新版本写入的分块总数 }
        failures:
          type: array
          description: '非致命失败明细（`标题：原因`）；成功时为空数组'
          items: { type: string }

    IndexState:
      type: object
      description: '索引版本状态（`DocumentDtos.IndexState`）。`document_fts` 只存可检索文本与 `chunk_id`。'
      required: [indexName, activeVersion, updatedAt, fts5Available, documentCount, chunkCount]
      properties:
        indexName: { type: string, const: document_fts }
        activeVersion: { type: integer, minimum: 1, description: 检索只读该版本的分块 }
        buildingVersion:
          type: [integer, 'null']
          minimum: 1
          description: '正在构建的新版本；无构建进行中时为 `null`'
        updatedAt: { type: string }
        fts5Available:
          type: boolean
          description: 'FTS5 + trigram 能力探测结果；`false` 时检索恒走关键词降级路径'
        documentCount: { type: integer, minimum: 0 }
        chunkCount: { type: integer, minimum: 0, description: '`activeVersion` 的分块数' }

    SearchHit:
      type: object
      description: |
        检索命中（`DocumentDtos.SearchHit`）。`snippet` 用 `[[` / `]]` 标记命中词，
        客户端必须按纯文本渲染（不得当 HTML 注入）。
      required: [documentId, chunkId, title, chunkIndex, snippet, score, matchMode]
      properties:
        documentId: { type: string }
        chunkId: { type: string }
        title: { type: string }
        pageNo: { type: [integer, 'null'], minimum: 1 }
        chunkIndex: { type: integer, minimum: 0 }
        snippet:
          type: string
          description: '命中片段（`[[命中词]]`）；固定窗口，非 HTML'
        score:
          type: number
          format: double
          description: |
            越大越相关。FTS5 路径 `score = -bm25`；关键词路径
            `score = 1000/(1+首次命中位置) + min(50, 命中次数×5)`（契约 §11.4）
        matchMode:
          type: string
          enum: [fts5, keyword]
          description: '本次实际生效的检索实现'

    SearchResponse:
      type: object
      description: '检索结果（`DocumentDtos.SearchResponse`）。`total` 等于本次返回的 `results` 长度（无总数查询）。'
      required: [query, mode, tookMs, total, results]
      properties:
        query:
          type: string
          description: '实际执行的查询串（已 trim）'
        mode:
          type: string
          enum: [fts5, keyword]
        tookMs: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }

    OrphanFile:
      type: object
      description: '孤儿文件：磁盘存在但 `imported_file` 无记录（`DocumentDtos.OrphanFile`）。'
      required: [fileId, relativePath, sizeBytes, modifiedAt]
      properties:
        fileId:
          type: string
          description: '目录名（`files/imports/<fileId>/`）；目录下每个过期文件各一条记录'
        relativePath:
          type: string
          description: '相对数据目录的路径（正斜杠），绝不返回绝对路径'
        sizeBytes: { type: integer, minimum: 0 }
        modifiedAt:
          type: string
          description: '文件修改时间（UTC ISO-8601）；读取失败时为空字符串'

    MissingFile:
      type: object
      description: '缺失文件：数据库有记录但磁盘文件不存在（`DocumentDtos.MissingFile`）。'
      required: [documentId, title, relativePath]
      properties:
        documentId: { type: string }
        title: { type: string }
        relativePath: { type: string }

    FileConsistencyReport:
      type: object
      description: '文件一致性报告（`DocumentDtos.FileConsistencyReport`）。'
      required: [orphanFiles, missingFiles, tempFiles, retentionHours]
      properties:
        orphanFiles:
          type: array
          description: '已超过保留窗口的孤儿文件，按 `relativePath` 升序'
          items: { $ref: '#/components/schemas/OrphanFile' }
        missingFiles:
          type: array
          items: { $ref: '#/components/schemas/MissingFile' }
        tempFiles: { type: integer, minimum: 0, description: 'temp 目录下的文件数（未按保留窗口过滤）' }
        retentionHours: { type: integer, description: '保留窗口小时数，实现里固定 24' }

    FileCleanupRequest:
      type: object
      description: '一致性补偿请求；整个请求体可省略（等价于 `dryRun=true`）。'
      properties:
        dryRun:
          type: [boolean, 'null']
          default: true
          description: '`true` 只报告不修改；只有显式 `false` 才执行删除与标记'

    FileCleanupResponse:
      type: object
      description: '一致性补偿结果（`DocumentDtos.FileCleanupResponse`）。'
      required: [removedFiles, markedFailed, dryRun]
      properties:
        removedFiles: { type: integer, minimum: 0, description: '删除的孤儿文件与过期临时文件总数；dry-run 下恒为 0' }
        markedFailed:
          type: integer
          minimum: 0
          description: '被标记为 `failed` 的资料数；dry-run 下统计的是**将被**标记的数量'
        dryRun: { type: boolean }

    Citation:
      type: object
      description: |
        讲解引用（Java 侧回映射后的形状，契约 §11.3）：`refId` 必须来自本次实际提供过的集合，
        且 `documentId`/`chunkId` 能回到真实分块逐字核对（模型给的 `used` 字段在回映射时被丢弃）。
      required: [refId, documentId, chunkId, title, snippet]
      properties:
        refId:
          type: string
          description: '模型引用标识，形如 `K1`；未提供过的 `refId` 一律丢弃'
        documentId: { type: string }
        chunkId: { type: string }
        title: { type: string }
        pageNo: { type: [integer, 'null'], minimum: 1 }
        snippet:
          type: string
          description: '分块内容前 200 字符（纯文本，非 HTML）'
